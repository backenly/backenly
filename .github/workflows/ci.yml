name: CI

# Runs on every push and PR. Deliberately split into jobs that need NO database
# (fast, always run) and jobs that need Postgres (service container), so a
# missing database can never silently skip the checks that guard published
# behaviour.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── No database CONNECTION required ─────────────────────────────────────────
  # These guard the contracts that broke in the 2026-07-19 post-mortem: the
  # published install command, the payment heuristic, intent conformance, the
  # destructive-confirmation window, and sensor honesty.
  #
  # The assertions are all pure functions and issue no queries — but the modules
  # they live in import the Prisma client at module load, and PrismaClient
  # validates DATABASE_URL when it is CONSTRUCTED, not when it first queries.
  # `.env` is gitignored, so without a placeholder the whole suite dies on
  # import. The URL below is deliberately unroutable: if any test ever starts
  # issuing real queries, it must fail loudly here rather than quietly acquiring
  # a hidden database dependency.
  static:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/unused
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:1/unused
      # jest.setup.js refuses to run without TEST_DATABASE_URL — a deliberate
      # "never run tests against production" guard. Satisfy it with the same
      # unroutable placeholder rather than weakening the guard.
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/unused
      JWT_SECRET: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc needs the generated Prisma client to resolve @prisma/client types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Under PostgREST the API IS the schema, so an ApiDefinition row decides
      # nothing — it is a second, writable copy of a fact the PostgreSQL catalog
      # already owns, and the only thing a second copy can do is disagree. It
      # did: the APIs page advertised CRUD on `_email_verifications`, a table the
      # runtime 404s. Every writer was deleted 2026-07-21; this keeps the next
      # one from being added. Runs here as well as in `npm run build` so a
      # violation is caught on push rather than at deploy time.
      - name: No ApiDefinition write paths
        run: npx tsx scripts/assert-no-apidefinition-writes.ts

      # tests/unit is deliberately database-free so it runs on every push.
      # docs-install-command.spec.ts is the one that fails when public/llms.txt
      # and the MCP CLI parser drift apart — the defect that made the published
      # install command unusable. It only protects anything if it runs here.
      - name: Unit tests
        run: npx jest tests/unit --ci --verbose

      # The self-healing guards. These are database-free too and were simply
      # never listed, so nothing ran them on push — and two had gone red in the
      # tree without anyone finding out:
      #
      #   • autonomy-is-model-free was reading auto-fix-engine.ts for a repair
      #     map that had moved to fix-actions.ts. It failed its own
      #     "did the regex match anything" guard, and while it failed it was also
      #     no longer watching the file where a model call could actually enter
      #     the repair path.
      #   • tests/core holds the trust guarantees — post-fix verification
      #     coverage, fix classification, repair conformance. All passing, all
      #     unenforced.
      #
      # Autonomy is the product's differentiator. Its guards belong on the
      # blocking path, not in a directory someone remembers to run by hand.
      - name: Autonomy guards
        run: npx jest tests/core __tests__/autonomy --ci --verbose

  # ── MCP server package ──────────────────────────────────────────────────────
  secrets:
    name: no credentials in committed content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # --tree only. The history scan needs full history and several minutes,
      # and its findings cannot be fixed by a pull request anyway — they are
      # resolved by publishing from a fresh repository. What CI can usefully
      # prevent is a NEW credential being committed, which is exactly what the
      # tree scan catches, on every push, before it reaches the history it
      # would then be stuck in.
      - name: preflight (working tree)
        run: npx tsx scripts/preflight-oss.ts --tree

  mcp-server:
    name: mcp-server build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install + build
        working-directory: packages/mcp-server
        run: |
          npm install
          npm run build
      - name: Verify the published entrypoint parses its documented flags
        working-directory: packages/mcp-server
        run: |
          node -e "
            const { parseServerFlags } = require('./dist/config.js');
          " 2>/dev/null || node --input-type=module -e "
            import { parseServerFlags } from './dist/config.js';
            const parsed = parseServerFlags(['--project','p1','--key','k1']);
            if (parsed.projectId !== 'p1' || parsed.apiKey !== 'k1') {
              console.error('documented flags not honoured:', parsed);
              process.exit(1);
            }
            console.log('install flags OK');
          "

  # ── Database-backed ─────────────────────────────────────────────────────────
  # Probe fixtures construct a violating state directly and assert the probe
  # FIRES. A probe that has never been observed producing a finding is presumed
  # broken, not healthy — detectMissingRls sat dead in every environment and
  # detectTablesWithNoApiDefinition was an unimplemented stub, both while the
  # dashboard rendered green.
  probes:
    name: probe fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backenly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backenly_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/backenly_test
      # Required by jest.setup.js. Here it is the real service container — the
      # fixtures create and drop their own schema inside it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backenly_test
      JWT_SECRET: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Push schema to the test database
        run: npx prisma db push --accept-data-loss --skip-generate
      - run: npx prisma generate
      # --forceExit: the modules under test hold their own Prisma singletons,
      # which this suite's afterAll cannot close, so Jest would hang on open
      # handles after a fully successful run.
      - name: Probe fixture suite
        run: npx jest tests/probes --ci --runInBand --verbose --forceExit

  # ── selfops-bench ───────────────────────────────────────────────────────────
  # The probe suite above proves each detector CAN fire. It does not prove the
  # loop closes: that a real fault, injected into a real backend, ends up
  # actually repaired, with the feature still working afterwards.
  #
  # This job runs that experiment and publishes the receipts. It is allowed to
  # fail cases — an unrepaired fault is a result, not a broken build — but it
  # fails the job on a HARNESS error, because a suite that could not run must
  # never be reported as a suite that found nothing.
  selfops-bench:
    name: selfops-bench (self-maintenance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backenly_bench
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # bench/selfops/env.ts pins every downstream consumer to this one URL so
      # the loop and the oracle can never address different databases.
      BENCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backenly_bench
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backenly_bench
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/backenly_bench
      # No JWT_SECRET: the bench sets `request.jwt.claims` in SQL directly and
      # never mints a token. Verified by running the suite with no .env present.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Push schema to the bench database
        run: npx prisma db push --accept-data-loss --skip-generate
      - run: npx prisma generate
      # The data plane is not just tables. `backenly_pgrst_prepare_schema` runs
      # as a CREATE SCHEMA event trigger and `backenly_jwt_claim` is what every
      # translated RLS policy calls — without them, provisioning a workspace
      # schema fails outright and every case dies before it is measured. The
      # bench must run against a production-shaped database or it is grading an
      # approximation of the data plane.
      # psql reads its connection from DATABASE_URL (already defined above)
      # rather than from an exported password variable. Exporting one was the
      # obvious way to write this step, and the preflight scanner correctly
      # rejected it: an inline password is the shape of a real leak even when
      # the value is a throwaway container credential. Suppressing that check to
      # keep the convenience would teach everyone to ignore it.
      #
      # The scanner also rejected the first version of THIS comment, which
      # quoted the offending line verbatim. It cannot tell a comment from code,
      # and it should not try — so the pattern is described, never written.
      - name: Install PostgREST data-plane SQL
        run: |
          psql "$DATABASE_URL" -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='backenly_user') THEN CREATE ROLE backenly_user NOLOGIN; END IF; END \$\$;"
          psql "$DATABASE_URL" -f scripts/sql/postgrest-schema-registry.sql
          psql "$DATABASE_URL" -f scripts/sql/postgrest-ddl-sync.sql
      # The build lock is on every mutation path in the product, and its release
      # bug was invisible to every application-level check — only pg_locks could
      # see it. These assert against pg_locks directly.
      - name: Build-lock release proof
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backenly_bench
        run: npx jest tests/bench --ci --runInBand --forceExit
      # Repeated so the headline is a claim rather than an anecdote. Any case
      # that is not unanimous across runs is named in the output.
      # --require-healed turns the in-catalogue cases into a regression gate.
      # Without it a case can go PASS -> FAIL and this job still reports green.
      # Only cases that actually heal today are listed; the out-of-catalogue
      # ones are expected to fail and stay ungated.
      - name: Run selfops-bench
        run: >-
          npm run bench:selfops -- --cycles 12 --repeat 3
          --require-healed rls-cross-tenant-read,rls-deny-all-lockout,rls-engine-dialect-mismatch,fk-column-unindexed,rls-wide-open-policy,fk-constraint-dropped,rls-write-path-over-permissive
      - name: Publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfops-bench-results
          path: bench/selfops/results/
