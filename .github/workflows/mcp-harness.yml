name: MCP reliability harness

# Runs the golden agent workflows against a LIVE project and scores them on
# outcome, turn count, and error quality. This is the regression net for the
# agent-facing contract: guards reproduce every defect from the 2026-07-19
# post-mortem, and `blind errors` counts failures an agent cannot self-correct
# from — the driver of blind retry loops.
#
# NOT run per-commit, for two reasons:
#   1. It exercises production, so it is scheduled rather than tied to pushes.
#   2. It CREATES TABLES and cannot drop them — destructive operations are
#      Review-Queue gated by design — so every run leaves `hx_*` artifacts.
#
# Because of (2), point BACKENLY_MCP_KEY at a DEDICATED THROWAWAY PROJECT, never
# at a project with real data. The run prints the cleanup SQL for its own tables.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on target-kind cases as well as guards'
        type: boolean
        default: true

jobs:
  harness:
    name: golden workflows vs production
    # Upstream only. A fork inherits the workflow file but not the secret, so a
    # contributor pressing "Run workflow" would get a red X on a run that could
    # never have worked — noise that reads like their change broke something.
    if: github.repository == 'backenly/backenly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Fail loudly rather than "succeeding" without having tested anything —
      # a green run that never ran is the exact class of false confidence this
      # harness exists to eliminate.
      - name: Require the MCP key
        env:
          BACKENLY_MCP_KEY: ${{ secrets.BACKENLY_MCP_KEY }}
        run: |
          if [ -z "$BACKENLY_MCP_KEY" ]; then
            echo "::error::BACKENLY_MCP_KEY is not set. Add it as a repository secret,"
            echo "::error::scoped to a DEDICATED THROWAWAY PROJECT — the harness leaves tables behind."
            exit 1
          fi

      - name: Run harness
        env:
          BACKENLY_MCP_KEY: ${{ secrets.BACKENLY_MCP_KEY }}
          BACKENLY_API_URL: ${{ vars.BACKENLY_API_URL || 'https://backenly.com' }}
        run: |
          npx tsx scripts/mcp-harness/run.ts \
            ${{ (github.event_name == 'schedule' || inputs.strict) && '--strict' || '' }}
