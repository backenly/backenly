version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: backenly-postgres-dev
    restart: unless-stopped
    # pg_stat_statements is the ONLY source of measured query latency in the
    # platform. Without it the `measured_slow_queries_are_indexed` invariant
    # cannot run at all, and Backenly can only find missing indexes by SHAPE
    # (this column is a foreign key) rather than by MEASUREMENT (Postgres is
    # spending 300ms per call filtering this column). It needs
    # shared_preload_libraries, which needs a restart, which is why it is set
    # here rather than left to a migration.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backenly_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-backenly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, as the superuser — the only
      # context in which CREATE EXTENSION for a preloaded library succeeds
      # without further grants.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backenly_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backenly-dev-network

  # Redis (optional, for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: backenly-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backenly-dev-network

  # PostgREST — the data plane. /db/* is served by this process, not by Next.
  #
  # Here because "Requires PostgREST" was the whole instruction: nothing in the
  # repository installed it and there was no config to copy, so the documented
  # quickstart could not produce a running data plane. An acceptance install on
  # a clean Ubuntu machine got as far as bootstrap and stopped.
  #
  # Pinned to the version production runs. PostgREST reads schema-cache and role
  # settings from the database, so a version drift between the two changes what
  # the data plane will serve.
  postgrest:
    image: postgrest/postgrest:v14.15
    container_name: backenly-postgrest-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connects as the authenticator, which is NOINHERIT and can do nothing
      # except SET ROLE to anon / authenticated / service_role.
      #
      # The password does not exist yet on a first `up`: it is issued later by
      # `setup-postgrest-roles.ts --apply`, which prints it once. Until it is put
      # in .env this container restarts in a loop, which is the correct and
      # visible behaviour — it must not serve anything before the role exists.
      PGRST_DB_URI: postgres://backenly_authenticator:${POSTGREST_AUTHENTICATOR_PASSWORD:-unset}@postgres:5432/${POSTGRES_DB:-backenly}
      PGRST_DB_ANON_ROLE: anon
      # Must match POSTGREST_JWT_SECRET in .env. The gateway mints short-lived
      # internal tokens with it; PostgREST holds exactly one JWT secret and so
      # cannot validate Backenly's per-project end-user tokens directly.
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:-}
      PGRST_SERVER_PORT: 3000
      # Deliberately NOT setting PGRST_DB_SCHEMAS. The served-schema list lives
      # in `ALTER ROLE backenly_authenticator SET pgrst.db_schemas`, written by
      # backenly_pgrst_register_schema, and in-database config is what lets a
      # newly provisioned project appear without editing this file.
    ports:
      # POSTGREST_URL in .env.example is http://127.0.0.1:3002.
      - "${POSTGREST_PORT:-3002}:3000"
    networks:
      - backenly-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  backenly-dev-network:
    driver: bridge

