version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: backenly-postgres-dev
    restart: unless-stopped
    # pg_stat_statements is the ONLY source of measured query latency in the
    # platform. Without it the `measured_slow_queries_are_indexed` invariant
    # cannot run at all, and Backenly can only find missing indexes by SHAPE
    # (this column is a foreign key) rather than by MEASUREMENT (Postgres is
    # spending 300ms per call filtering this column). It needs
    # shared_preload_libraries, which needs a restart, which is why it is set
    # here rather than left to a migration.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backenly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-backenly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, as the superuser — the only
      # context in which CREATE EXTENSION for a preloaded library succeeds
      # without further grants.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backenly}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backenly-dev-network

  # Redis (optional, for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: backenly-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backenly-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  backenly-dev-network:
    driver: bridge

