# Backenly Worker - Fly.io Configuration
app = "backenly-worker"
primary_region = "iad" # US East (closest to most users)

[build]
  image = "backenly-worker:latest"

[env]
  NODE_ENV = "production"
  WORKER_MODE = "db"
  WORKSPACE_ROOT = "/workspace"

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
