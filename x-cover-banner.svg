<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0f0a24"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>

    <!-- Left-side purple glow for visual area -->
    <radialGradient id="leftGlow" cx="30%" cy="50%" rx="35%" ry="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#581cdc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#581cdc" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple text gradient -->
    <linearGradient id="purpleText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <!-- Dot grid pattern -->
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.6" fill="rgba(255,255,255,0.06)"/>
    </pattern>

    <!-- Clip for left visual area -->
    <clipPath id="leftClip">
      <rect x="0" y="0" width="620" height="500"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Dot grid -->
  <rect width="1500" height="500" fill="url(#dots)"/>

  <!-- Left glow -->
  <rect width="1500" height="500" fill="url(#leftGlow)"/>

  <!-- === LEFT SIDE: Abstract backend architecture visual === -->
  <g clip-path="url(#leftClip)" opacity="0.9">

    <!-- Faded code in background -->
    <g opacity="0.12" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#a78bfa">
      <text x="30" y="60">1. import { createClient } from '@backenly/sdk'</text>
      <text x="30" y="80">2. const backend = createClient({ projectId })</text>
      <text x="30" y="100">3.</text>
      <text x="30" y="120">4. const users = await backend.users.list()</text>
      <text x="30" y="140">5. const post = await backend.posts.create({</text>
      <text x="30" y="160">6.   title: "Hello World",</text>
      <text x="30" y="180">7.   author: user.id</text>
      <text x="30" y="200">8. })</text>
      <text x="30" y="220">9.</text>
      <text x="30" y="240">10. backend.realtime.subscribe('posts', (e) => {</text>
      <text x="30" y="260">11.   console.log('New post:', e.data)</text>
      <text x="30" y="280">12. })</text>
      <text x="30" y="320">13. await backend.auth.signUp({</text>
      <text x="30" y="340">14.   email, password</text>
      <text x="30" y="360">15. })</text>
      <text x="30" y="400">16. const url = await backend.storage.upload(file)</text>
      <text x="30" y="420">17. await backend.triggers.create({</text>
      <text x="30" y="440">18.   table: 'orders', event: 'insert'</text>
      <text x="30" y="460">19. })</text>
    </g>

    <!-- Architecture nodes and connections -->
    <g>
      <!-- Connection lines -->
      <line x1="280" y1="170" x2="400" y2="250" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
      <line x1="280" y1="170" x2="180" y2="290" stroke="#7c3aed" stroke-width="1" opacity="0.15"/>
      <line x1="400" y1="250" x2="320" y2="370" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
      <line x1="180" y1="290" x2="320" y2="370" stroke="#7c3aed" stroke-width="1" opacity="0.15"/>
      <line x1="400" y1="250" x2="500" y2="170" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>
      <line x1="500" y1="170" x2="540" y2="310" stroke="#7c3aed" stroke-width="1" opacity="0.1"/>
      <line x1="400" y1="250" x2="540" y2="310" stroke="#7c3aed" stroke-width="1" opacity="0.12"/>

      <!-- Glowing nodes -->
      <circle cx="280" cy="170" r="16" fill="#0f0a24" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
      <circle cx="280" cy="170" r="4" fill="#a78bfa" opacity="0.9"/>

      <circle cx="400" cy="250" r="20" fill="#0f0a24" stroke="#a78bfa" stroke-width="1.5" opacity="0.8"/>
      <circle cx="400" cy="250" r="5" fill="#c4b5fd" opacity="1"/>

      <circle cx="180" cy="290" r="14" fill="#0f0a24" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
      <circle cx="180" cy="290" r="3.5" fill="#a78bfa" opacity="0.7"/>

      <circle cx="320" cy="370" r="16" fill="#0f0a24" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
      <circle cx="320" cy="370" r="4" fill="#a78bfa" opacity="0.8"/>

      <circle cx="500" cy="170" r="12" fill="#0f0a24" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
      <circle cx="500" cy="170" r="3" fill="#a78bfa" opacity="0.6"/>

      <circle cx="540" cy="310" r="10" fill="#0f0a24" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
      <circle cx="540" cy="310" r="2.5" fill="#a78bfa" opacity="0.5"/>

      <!-- Node labels -->
      <text x="280" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(167,139,250,0.5)" font-weight="500">AUTH</text>
      <text x="400" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(196,181,253,0.6)" font-weight="600">DATABASE</text>
      <text x="180" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(167,139,250,0.4)" font-weight="500">STORAGE</text>
      <text x="320" y="402" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="rgba(167,139,250,0.45)" font-weight="500">REALTIME</text>
      <text x="500" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="rgba(167,139,250,0.35)" font-weight="500">API</text>
      <text x="540" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="rgba(167,139,250,0.3)" font-weight="500">TRIGGERS</text>
    </g>
  </g>

  <!-- Fade-out gradient over left side edge -->
  <defs>
    <linearGradient id="leftFade" x1="500" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="500" y="0" width="150" height="500" fill="url(#leftFade)"/>

  <!-- Vertical divider line -->
  <line x1="680" y1="120" x2="680" y2="380" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>

  <!-- === RIGHT SIDE: Brand + Tagline === -->

  <!-- Brand name -->
  <text x="730" y="200" text-anchor="start"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    backenly
  </text>

  <!-- Tagline -->
  <text x="730" y="260" text-anchor="start"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" letter-spacing="-0.3">
    <tspan fill="rgba(255,255,255,0.5)">The </tspan>
    <tspan fill="url(#purpleText)" font-weight="600" font-style="italic">AI-Native</tspan>
    <tspan fill="rgba(255,255,255,0.8)"> Backend Platform</tspan>
  </text>

  <!-- Accent line under tagline -->
  <rect x="730" y="280" width="400" height="1" fill="url(#accentLine)"/>

  <!-- Subtitle -->
  <text x="730" y="320" text-anchor="start"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="400" fill="rgba(255,255,255,0.35)" letter-spacing="0.3">
    Databases, Auth, APIs, Realtime
  </text>
  <text x="730" y="345" text-anchor="start"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="400" fill="rgba(255,255,255,0.35)" letter-spacing="0.3">
    Generated and deployed from natural language
  </text>

  <!-- Website URL -->
  <text x="1410" y="460" text-anchor="end"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="rgba(167,139,250,0.5)" letter-spacing="0.5">
    backenly.com
  </text>

  <!-- Top/bottom edge fade -->
  <defs>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a1a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="460" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08080f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08080f" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="40" fill="url(#topFade)"/>
  <rect y="460" width="1500" height="40" fill="url(#bottomFade)"/>
</svg>
